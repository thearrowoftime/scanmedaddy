name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check --output-format=github .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
        exclude:
          # One Windows job is enough to catch path/encoding issues
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -q

  demo:
    # Proves the CLI works end to end on the sample configs, exit codes included
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Import sample configs
        run: netaudit backup --demo
      - name: Audit must flag the intentionally insecure samples
        run: |
          set +e
          netaudit audit --export reports/audit.md --csv reports/audit.csv \
            --wazuh-file reports/wazuh-netaudit.json
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit code 2 (critical/high findings), got $code"
            exit 1
          fi
      - name: Inventory facts must detect the sample firmware
        run: |
          netaudit facts --json reports/facts.json
          python -c "import json;f=json.load(open('reports/facts.json'));assert any(d['firmware'] for d in f), f"
      - name: Baseline drift is reported against the shipped golden config
        run: netaudit baseline --profile baselines/fortigate-lab.yaml --export reports/drift.md
      - name: Compliance score and control mapping
        run: |
          netaudit compliance --baseline baselines/fortigate-lab.yaml \
            --export reports/compliance.md --csv reports/scores.csv
          grep -q 'IEC 62443' reports/compliance.md
      - name: Wazuh logtest samples stay in sync with the decoder format
        run: |
          netaudit wazuh-samples --file samples/fg-120g-01.cfg --platform fortigate \
            --out /tmp/samples.log
          grep -q '^<134>' /tmp/samples.log
      - uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: reports/
